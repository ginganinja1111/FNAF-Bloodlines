<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMUNITY — Five Nights at Freddy's: Bloodlines</title>
<link rel="icon" type="image/png" href="FNAFBloodlinesLogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAV: hover-triggered tab icon + sliding side panel -->
  <nav class="tab-nav" id="tabNav">
    <button class="tab-icon" id="tabIcon" aria-label="Open site navigation" aria-expanded="false"></button>
    <aside class="side-panel" id="sidePanel">
      <a class="side-link" href="index.html">Home</a>
      <a class="side-link" href="characters.html">Characters</a>
      <a class="side-link" href="episodes.html">Episodes</a>
      <a class="side-link" href="locations.html">Locations</a>
      <a class="side-link" href="watch.html">Watch</a>
      <a class="side-link" href="about.html">About</a>
    </aside>
  </nav>

  <section class="community-page">
    <header class="community-header">
      <img src="FNAFBloodlinesLogo.png" alt="" class="community-logo" aria-hidden="true">
      <h1 class="community-title">COMMUNITY</h1>
    </header>

    <div class="chat-box" id="chatBox">
      <div class="chat-status" id="chatStatus">Connecting…</div>
      <div class="chat-messages" id="chatMessages"></div>
    </div>

    <form class="chat-form" id="chatForm">
      <input type="text" id="chatName" class="chat-input chat-name" placeholder="Name" maxlength="20" autocomplete="off" required>
      <input type="text" id="chatText" class="chat-input chat-text" placeholder="Say something..." maxlength="240" autocomplete="off" required>
      <button type="submit" class="chat-send">Send</button>
    </form>
  </section>

<!-- Firebase (free tier) powers the live chat below. See firebase-config.js
     for the one-time setup — the chat won't connect until that's filled in. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="chat.js"></script>
<script src="script.js"></script>
</body>
</html>
